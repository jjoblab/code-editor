# Publication Maven vers GitHub Packages.
#
# Déclenchement MANUEL (onglet Actions > « Publication GitHub Packages » >
# Run workflow) : la version publiée est celle de gradle.properties
# (propagée aux 4 modules par le build racine). GitHub Packages refusant
# le remplacement d'une version déjà publiée, incrémenter la version dans
# gradle.properties avant chaque publication.
#
# Identifiants : le GITHUB_TOKEN du runner (permissions packages:write)
# est injecté via les propriétés gpr.user / gpr.key attendues par les
# blocs publishing des modules — les mêmes que la procédure manuelle
# documentée dans BUILD.md.
#
# JDK 17 Temurin : même toolchain que ci.yml (Gradle 9.5.1 / AGP 9).
name: Publication GitHub Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-github-packages
  cancel-in-progress: false

jobs:
  publish:
    name: publish (4 modules AAR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Publish cel-core, cel-lsp-api, cel-lsp, cel-ui
        run: >-
          ./gradlew publish --stacktrace
          -Pgpr.user=${{ github.actor }}
          -Pgpr.key=${{ secrets.GITHUB_TOKEN }}

      - name: Upload rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-reports-failure
          path: |
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 7
