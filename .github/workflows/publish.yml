# Publication Maven vers GitHub Packages — les 4 AAR (cel-core,
# cel-lsp-api, cel-lsp, cel-ui).
#
# Déclenchement :
#   * pousser un tag de version STRICT `vX.Y.Z` — le filtre de tag ci-dessous
#     est un GLOB GitHub Actions (le `+` d'une regex y serait littéral) :
#     `v[0-9]*.[0-9]*.[0-9]*` ne matche que les tags à trois composantes
#     numériques, donc les tags atypiques `vX.Y.Z.n` de ce dépôt ne publient
#     pas ;
#   * ou manuellement (onglet Actions > « Publication GitHub Packages » >
#     Run workflow).
#
# SEUL workflow déclenché par les tags de version : ci.yml ne réagit qu'aux
# branches et aux PR (pas de répétition redondante du build au tag — les
# tests ci-dessous constituent la répétition générale de publication).
#
# Version : lue dans `build.gradle.kts` (racine), ligne `version = "…"` —
# propagée aux 4 modules par le build racine. Garde-fou : sur un
# déclenchement par tag, le workflow échoue si le tag ne correspond pas
# exactement à `v` + version du build (GitHub Packages refuse le
# remplacement d'une version déjà publiée : un tag qui ne correspond pas,
# ou un rejeu, doit échouer clairement plutôt que publier n'importe quoi).
#
# Les tests passent AVANT la publication (`assembleRelease test`) : un tag
# rouge ne publie jamais.
#
# Procédure de publication :
#   1. incrémenter `version = "…"` dans build.gradle.kts (racine),
#   2. committer sur main (déclenche ci.yml : build + tests + lint),
#   3. `git tag -a vX.Y.Z -m "…"` (X.Y.Z = la version du build),
#   4. `git push origin main --tags` — pousse main et le tag ; le tag
#      déclenche UNIQUEMENT ce workflow (tests puis publication).
#      Pour différer la publication : `git push origin main` puis plus
#      tard `git push origin vX.Y.Z`.
#
# Identifiants : le GITHUB_TOKEN du runner (permissions packages:write)
# est injecté via les propriétés gpr.user / gpr.key attendues par les
# blocs publishing des modules — les mêmes que la procédure manuelle
# documentée dans BUILD.md.
#
# JDK 17 Temurin : même toolchain que ci.yml (Gradle 9.5.1 / AGP 9).
# Actions épinglées par SHA de commit (mise à jour par Dependabot).
name: Publication GitHub Packages

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-github-packages
  cancel-in-progress: false

jobs:
  publish:
    name: publish (4 modules AAR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Garde-fou de version (tag ≠ version du build → échec)
        if: github.event_name == 'push'
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::version introuvable dans build.gradle.kts (ligne version = \"…\")"
            exit 1
          fi
          if ! echo "${{ github.ref_name }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '${{ github.ref_name }}' n'est pas une version stricte vX.Y.Z"
            exit 1
          fi
          if [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::tag '${{ github.ref_name }}' ≠ v$VERSION (version du build) — GitHub Packages refuse le remplacement d'une version déjà publiée."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} = version du build ($VERSION)"

      - name: Set up JDK 17 (Temurin)
        # v4.9.1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache + wrapper validation)
        # v4.4.4
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          validate-wrappers: true

      - name: Tests avant publication (un tag rouge ne publie jamais)
        run: ./gradlew assembleRelease test --stacktrace

      - name: Publish cel-core, cel-lsp-api, cel-lsp, cel-ui
        run: >-
          ./gradlew publish --stacktrace
          -Pgpr.user=${{ github.actor }}
          -Pgpr.key=${{ secrets.GITHUB_TOKEN }}

      - name: Upload rapports en cas d'échec
        if: failure()
        # v4.6.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publish-reports-failure
          path: |
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 7
