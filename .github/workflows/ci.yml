# Intégration continue.
#
# Deux jobs :
#   build   — chaque push (main/master) et chaque PR : assemble les 4 AAR,
#             exécute la suite complète de tests unitaires, lance lint.
#             Zéro erreur exigé.
#   release — uniquement sur les tags `v*` : assemble en plus les variantes
#             release et valide la publication Maven
#             (publishToMavenLocal en répétition générale) pour ne jamais
#             pousser un tag à l'aveugle — le même contrat que JitPack
#             construira à la demande.
#
# Notes toolchain :
#   * JDK 17 Temurin — aligné sur jitpack.yml et la toolchain
#     Gradle 9.5.1 / AGP 9 (Java 17 est le minimum AGP 9 pour la
#     compilation des bibliothèques).
#   * `gradle/actions/setup-gradle` fournit le cache de téléchargement
#     Gradle ET valide les JAR du wrapper (protection de la chaîne
#     d'approvisionnement). Les builds de PR ne lisent que le cache pour
#     que `main` reste l'unique rédacteur du cache.
#   * Le runner ubuntu hébergé embarque un SDK Android préinstallé avec
#     les licences acceptées ; AGP télécharge automatiquement toute
#     plateforme manquante (compileSdk 34) — aucun local.properties
#     n'est nécessaire (il est gitignoré).
#   * AGP 9 : `testReleaseUnitTest` n'existe plus — les tests unitaires
#     tournent sur la variante debug, c'est ce qu'invoque ce workflow.
name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, tests et lint (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mise en place JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Mise en place Gradle (cache + validation du wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Assemblage (debug, 4 modules)
        run: ./gradlew assembleDebug --stacktrace

      - name: Tests unitaires (variante debug, tous les modules)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (tous les modules)
        run: ./gradlew lint --stacktrace

      - name: Téléversement des rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-failure
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html
            **/build/intermediates/lint-cache/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Contrôle de release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Mise en place Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Assemblage release + validation de la publication Maven
        # publishToMavenLocal est une répétition générale du build JitPack :
        # il doit produire les AAR cel-core/cel-lsp-api/cel-lsp/cel-ui +
        # sources.jar + POM avec la version tirée du tag.
        run: ./gradlew assembleRelease publishToMavenLocal --stacktrace

      - name: Téléversement des artefacts de release
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            **/build/outputs/aar/*.aar
            ~/.m2/repository/jo/codeeditor/**/*.aar
            ~/.m2/repository/jo/codeeditor/**/*.jar
            ~/.m2/repository/jo/codeeditor/**/*.pom
          if-no-files-found: error
          retention-days: 14
