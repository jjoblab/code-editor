# v3.37.0 (roadmap item 12) — Continuous Integration.
#
# Two jobs:
#   build   — every push (main) and every PR: assemble the 4 AARs, run the
#             full unit-test suite, run lint. Zero errors required.
#   release — only on tags `v*`: additionally assembles the release
#             variants and validates the Maven publication
#             (publishToMavenLocal dry-run) so a tag is never pushed
#             blind — the same contract JitPack will build on demand.
#
# Toolchain notes:
#   * JDK 17 Temurin — matches jitpack.yml and the Gradle 9.5.1 / AGP 9
#     toolchain (Java 17 is the AGP 9 minimum for library compilation).
#   * `gradle/actions/setup-gradle` provides the Gradle download cache
#     AND validates the wrapper JARs (supply-chain protection). PR builds
#     only read the cache so `main` stays the single cache writer.
#   * The hosted ubuntu runner ships a preinstalled Android SDK with
#     accepted licenses; AGP auto-downloads any missing platform
#     (compileSdk 34) — no local.properties is needed (it is gitignored).
#   * AGP 9: `testReleaseUnitTest` no longer exists — unit tests run on
#     the debug variant, which is what this workflow invokes.
name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, tests & lint (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Assemble (debug, 4 modules)
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests (debug variant, all modules)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (all modules)
        run: ./gradlew lint --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-failure
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html
            **/build/intermediates/lint-cache/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Release check (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Assemble release + validate Maven publication
        # publishToMavenLocal is a dry-run of the JitPack build: it must
        # produce cel-core/cel-lsp-api/cel-lsp/cel-ui AAR + sources.jar
        # + POM with the version taken from the tag.
        run: ./gradlew assembleRelease publishToMavenLocal --stacktrace

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            **/build/outputs/aar/*.aar
            ~/.m2/repository/jo/codeeditor/**/*.aar
            ~/.m2/repository/jo/codeeditor/**/*.jar
            ~/.m2/repository/jo/codeeditor/**/*.pom
          if-no-files-found: error
          retention-days: 14
