# Intégration continue.
#
# Un job :
#   build — chaque push (main/master) et chaque PR : assemble les 4 AAR,
#           exécute la suite complète de tests unitaires, lance lint
#           (bloquant), contrôle les références externes et l'écart entre
#           les chiffres annoncés dans la documentation et la réalité.
#
# Les tags `v*` ne déclenchent PAS ce workflow : la publication (tests +
# publication Maven) est portée uniquement par publish.yml — pas de
# double déclenchement au tag.
#
# Notes toolchain :
#   * JDK 17 Temurin — aligné sur jitpack.yml et la toolchain
#     Gradle 9.5.1 / AGP 9 (Java 17 est le minimum AGP 9 pour la
#     compilation des bibliothèques).
#   * `gradle/actions/setup-gradle` fournit le cache de téléchargement
#     Gradle ET valide les JAR du wrapper (protection de la chaîne
#     d'approvisionnement). Les builds de PR ne lisent que le cache pour
#     que `main` reste l'unique rédacteur du cache.
#   * Actions épinglées par SHA de commit (mise à jour par Dependabot,
#     cf. .github/dependabot.yml) — ne jamais revenir à un tag mobile.
#   * Le runner ubuntu hébergé embarque un SDK Android préinstallé avec
#     les licences acceptées ; AGP télécharge automatiquement toute
#     plateforme manquante (compileSdk 34) — aucun local.properties
#     n'est nécessaire (il est gitignoré).
#   * AGP 9 : `testReleaseUnitTest` n'existe plus — les tests unitaires
#     tournent sur la variante debug, c'est ce qu'invoque ce workflow.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, tests, lint et contrôles (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Mise en place JDK 17 (Temurin)
        # v4.9.1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Mise en place Gradle (cache + validation du wrapper)
        # v4.4.4
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Garde-fou anti-références externes
        # Heuristiques génériques (URLs de dépôts tiers, formules
        # d'inspiration) + motifs nominatifs lus dans le secret
        # FORBIDDEN_REFS_EXTRA. Secret absent : le contrôle nominatif est
        # ignoré sans erreur (signalé dans le journal du script).
        env:
          FORBIDDEN_REFS_EXTRA: ${{ secrets.FORBIDDEN_REFS_EXTRA }}
        run: sh scripts/check-external-refs.sh --all

      - name: Assemblage (debug, 4 modules)
        run: ./gradlew assembleDebug --stacktrace

      - name: Tests unitaires (variante debug, tous les modules)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Couverture des tests (mode RAPPORT, jamais bloquant)
        # A-06 (audit 3.69.0) : les rapports Jacoco des tests unitaires
        # sont générés et téléversés — AUCUN seuil, aucun échec possible
        # sur le taux : la couverture informe d'abord (mode rapport),
        # le passage bloquant se discutera sur des chiffres réels.
        run: ./gradlew createDebugUnitTestCoverageReport --continue

      - name: Chiffres documentés = chiffres mesurés
        # Le total de tests annoncé dans README.md doit coller (±5 %) au
        # total réellement exécuté — la documentation ne peut plus
        # silencieusement dériver.
        run: sh scripts/check-doc-figures.sh

      - name: Budget des classes orchestrateurs
        # La décomposition (docs/plans/01, 02) ne doit jamais régresser :
        # plafonds ratchet — voir scripts/check-class-budgets.sh.
        run: sh scripts/check-class-budgets.sh

      - name: Lint (tous les modules, bloquant)
        run: ./gradlew lint --stacktrace

      - name: Téléversement des rapports de couverture (toujours)
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-reports
          path: |
            **/build/reports/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Téléversement des rapports lint (toujours)
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Téléversement des rapports en cas d'échec
        if: failure()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-reports-failure
          path: |
            **/build/reports/tests/
            **/build/intermediates/lint-cache/
          if-no-files-found: ignore
          retention-days: 7
