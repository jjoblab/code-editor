# Environnement de build JitPack.
# La bibliothèque cible Java 17 (AGP 9.0.0 + Gradle 9.5.1 l'exigent au
# minimum) ; sans ce fichier JitPack peut choisir un JDK incapable
# d'exécuter le build.
jdk:
  - openjdk17

before_install:
  - sdk install java 17.0.2-open
  - sdk use java 17.0.2-open
  # Fix: git dubious ownership (JitPack 2024+ sur Linux).
  - git config --global --add safe.directory /build

install:
  # JitPack exécute publishToMavenLocal par défaut. On le fait
  # explicitement avec --no-daemon pour éviter les timeouts et
  # les problèmes de cache du daemon Gradle sur l'infra JitPack.
  - ./gradlew publishToMavenLocal --no-daemon -x test -x lint
